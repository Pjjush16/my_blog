<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 · YAONET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#f7f6f3;--surface:#fff;--text:#1a1a1a;--text-2:#5f5f5f;--text-3:#8a8a8a;
    --border:rgba(0,0,0,.07);--accent:#2d5a4a;--accent-soft:#e8efec;
    --radius-lg:20px;--radius-md:14px;--radius-sm:10px;
    --font:'Manrope',system-ui,-apple-system,sans-serif;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 8px 30px rgba(0,0,0,.06);
    --max-width:1120px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f0f0f;--surface:#1a1a1a;--text:#f0f0f0;--text-2:#a0a0a0;--text-3:#6e6e6e;
      --border:rgba(255,255,255,.08);--accent:#7fbfa8;--accent-soft:#1f2e29;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 8px 30px rgba(0,0,0,.4);}
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .container{max-width:var(--max-width);margin:0 auto;padding:0 24px}

  .site-header{position:sticky;top:0;z-index:100;backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--border)}
  .header-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
  .site-brand{font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
  .site-brand span{color:var(--accent)}
  .nav-links{display:flex;align-items:center;gap:28px;list-style:none}
  .nav-links a{font-size:.92rem;font-weight:500;color:var(--text-2);transition:color .2s}
  .nav-links a:hover{color:var(--text)}
  .nav-cta{padding:8px 18px;border-radius:999px;background:var(--accent);color:#fff !important;font-weight:600;font-size:.88rem;transition:opacity .2s}
  .nav-cta:hover{opacity:.85}

  .page-head{padding:56px 0 32px}
  .page-head .eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 14px;border-radius:999px;margin-bottom:18px}
  .page-head h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;letter-spacing:-.04em;line-height:1.15}
  .page-head p{margin-top:10px;color:var(--text-2);font-size:1rem;max-width:560px}

  .post-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding-bottom:64px}
  .post-card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:var(--shadow-sm)}
  .post-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
  .post-card h3{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.4;margin-bottom:8px}
  .post-card .meta{font-size:.76rem;color:var(--text-3);margin-bottom:10px}
  .post-card .excerpt{font-size:.88rem;color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .state{padding:48px 0;text-align:center;color:var(--text-3);font-size:.9rem;grid-column:1/-1}
  .state.error{color:#c0392b}

  /* 文章详情 */
  .post-view{padding:40px 0 72px;max-width:760px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text-3);margin-bottom:24px;transition:color .2s}
  .back:hover{color:var(--accent)}
  .post-view h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.04em;line-height:1.2;margin-bottom:12px}
  .post-view .meta{font-size:.82rem;color:var(--text-3);padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:32px}
  .post-footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}

  .prose{font-size:1rem;line-height:1.85;color:var(--text)}
  .prose h1,.prose h2,.prose h3,.prose h4{font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:1.8em 0 .7em}
  .prose h1{font-size:1.7rem}.prose h2{font-size:1.4rem}.prose h3{font-size:1.15rem}.prose h4{font-size:1rem}
  .prose p{margin:1em 0}
  .prose a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .prose ul,.prose ol{padding-left:1.5em;margin:1em 0}
  .prose li{margin:.35em 0}
  .prose blockquote{border-left:3px solid var(--accent);padding:4px 0 4px 18px;color:var(--text-2);margin:1.4em 0;background:var(--accent-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .prose code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.875em;background:var(--accent-soft);color:var(--text);padding:2px 6px;border-radius:6px}
  .prose pre{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;overflow-x:auto;margin:1.4em 0}
  .prose pre code{background:none;padding:0;font-size:.85rem;line-height:1.6}
  .prose img{max-width:100%;border-radius:var(--radius-md);margin:1.4em 0}
  .prose hr{border:0;border-top:1px solid var(--border);margin:2.4em 0}
  .prose table{width:100%;border-collapse:collapse;margin:1.4em 0;font-size:.9rem}
  .prose th,.prose td{border:1px solid var(--border);padding:8px 12px;text-align:left}
  .prose th{background:var(--surface);font-weight:600}

  .site-footer{border-top:1px solid var(--border);padding:36px 0}
  .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:.82rem;color:var(--text-3)}
  .footer-links{display:flex;gap:20px}
  .footer-links a:hover{color:var(--text)}

  @media (max-width:900px){.post-grid{grid-template-columns:1fr}}
  @media (max-width:640px){
    .nav-links{display:none}
    .page-head{padding:40px 0 24px}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="https://yaonet.de5.net" class="site-brand">YAO<span>NET</span></a>
    <nav>
      <ul class="nav-links">
        <li><a href="https://yaonet.de5.net">首页</a></li>
        <li><a href="./">全部文章</a></li>
        <li><a href="https://github.com/" target="_blank" rel="noopener" class="nav-cta">GitHub →</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  <section id="view-list">
    <div class="page-head">
      <div class="eyebrow">YAONET · 博客</div>
      <h1>所有文章</h1>
      <p>技术、产品与日常观察。按时间倒序排列。</p>
    </div>
    <div id="list" class="post-grid">
      <div class="state">加载中…</div>
    </div>
  </section>

  <article id="view-post" class="post-view" hidden>
    <a class="back" href="./" data-list>← 返回文章列表</a>
    <h1 id="post-title"></h1>
    <div id="post-meta" class="meta"></div>
    <div id="post-body" class="prose"></div>
    <div class="post-footer">
      <a class="back" href="./" data-list>← 返回文章列表</a>
    </div>
  </article>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>© 2025 YAONET · 用简洁的方式记录</span>
    <div class="footer-links">
      <a href="https://yaonet.de5.net">首页</a>
      <a href="https://t.me/yao_cn" target="_blank" rel="noopener">Telegram</a>
      <a href="mailto:yaoqingxuan20221@outlook.com">邮件</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
<script>
  // ===== 内容路径（GitHub Pages 仓库根下）=====
  const CONTENT_BASE = './content';
  const POSTS_DIR    = 'posts';

  const listEl  = document.getElementById('list');
  const viewList = document.getElementById('view-list');
  const viewPost = document.getElementById('view-post');
  const titleEl  = document.getElementById('post-title');
  const metaEl   = document.getElementById('post-meta');
  const bodyEl   = document.getElementById('post-body');

  let indexCache = null;

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmt(iso){
    try{ return new Date(iso).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}); }catch(e){ return ''; }
  }

  async function getIndex(){
    if(indexCache) return indexCache;
    const res = await fetch(CONTENT_BASE + '/index.json', { cache: 'no-cache' });
    if(!res.ok) throw new Error('index ' + res.status);
    const data = await res.json();
    indexCache = Array.isArray(data) ? data : [];
    return indexCache;
  }

  function renderList(posts){
    if(!posts.length){
      listEl.innerHTML = '<div class="state">还没有文章。</div>';
      return;
    }
    listEl.innerHTML = posts.map(function(p){
      return '<a class="post-card" href="?id=' + encodeURIComponent(p.id) + '" data-post="' + esc(p.id) + '">' +
        '<h3>' + esc(p.title || '无标题') + '</h3>' +
        '<div class="meta">' + fmt(p.createdAt) + '</div>' +
        '<div class="excerpt">' + esc(p.excerpt || '') + '</div>' +
      '</a>';
    }).join('');
  }

  async function showList(){
    viewList.hidden = false;
    viewPost.hidden = true;
    document.title = '博客 · YAONET';
    try{
      const posts = await getIndex();
      renderList(posts);
    }catch(e){
      listEl.innerHTML = '<div class="state error">加载失败，请检查 content/index.json 是否存在。</div>';
    }
  }

  async function showPost(id){
    viewList.hidden = true;
    viewPost.hidden = false;
    titleEl.textContent = '加载中…';
    metaEl.textContent = '';
    bodyEl.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'instant' });

    try{
      const posts = await getIndex();
      const entry = posts.find(function(p){ return p.id === id; }) || {};

      const res = await fetch(CONTENT_BASE + '/' + POSTS_DIR + '/' + encodeURIComponent(id) + '.md', { cache: 'no-cache' });
      if(!res.ok) throw new Error('文章 ' + res.status);
      const md = await res.text();

      titleEl.textContent = entry.title || id;
      metaEl.textContent = fmt(entry.createdAt);
      document.title = (entry.title || id) + ' · YAONET';

      bodyEl.innerHTML = marked.parse(md);
      bodyEl.querySelectorAll('pre code').forEach(function(el){ hljs.highlightElement(el); });
    }catch(e){
      titleEl.textContent = '文章不存在';
      metaEl.textContent = '';
      bodyEl.innerHTML = '<p>没有找到这篇文章，可能已被删除或链接有误。</p>';
      document.title = '文章不存在 · YAONET';
    }
  }

  function route(){
    const id = new URLSearchParams(location.search).get('id');
    if(id) showPost(id);
    else showList();
  }

  document.addEventListener('click', function(e){
    const postLink = e.target.closest('a[data-post]');
    if(postLink){
      e.preventDefault();
      const id = postLink.getAttribute('data-post');
      history.pushState({ id: id }, '', '?id=' + encodeURIComponent(id));
      showPost(id);
      return;
    }
    const listLink = e.target.closest('a[data-list]');
    if(listLink){
      e.preventDefault();
      history.pushState({}, '', './');
      showList();
    }
  });

  window.addEventListener('popstate', route);
  route();
</script>
</body>
</html>
