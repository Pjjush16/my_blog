<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAONET · 博客</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;--surface:#fff;--text:#1a1a1a;--text-2:#5f5f5f;--text-3:#8a8a8a;
    --border:rgba(0,0,0,.07);--accent:#2d5a4a;--accent-soft:#e8efec;
    --radius:16px;--font:'Manrope',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f0f0f;--surface:#1a1a1a;--text:#f0f0f0;--text-2:#a0a0a0;--text-3:#6e6e6e;--border:rgba(255,255,255,.08);--accent:#7fbfa8;--accent-soft:#1f2e29;}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7}
  a{color:inherit;text-decoration:none}
  .container{max-width:720px;margin:0 auto;padding:0 24px}
  header{border-bottom:1px solid var(--border);padding:20px 0}
  .header-inner{display:flex;align-items:center;justify-content:space-between}
  .brand{font-size:1.35rem;font-weight:800;letter-spacing:-.03em}
  .brand span{color:var(--accent)}
  .header-links{display:flex;gap:20px;font-size:.82rem;color:var(--text-3)}
  .header-links a:hover{color:var(--accent)}
  main{padding:40px 0 64px}
  .list-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .list-head h2{font-size:1.2rem;font-weight:700;letter-spacing:-.02em}
  .list-head a{font-size:.85rem;color:var(--text-3)}
  .list-head a:hover{color:var(--accent)}
  .post-card{display:block;padding:24px 0;border-bottom:1px solid var(--border);transition:padding-left .2s}
  .post-card:hover{padding-left:6px}
  .post-card:first-of-type{border-top:1px solid var(--border)}
  .post-card h3{font-size:1.08rem;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
  .post-card:hover h3{color:var(--accent)}
  .post-card .meta{font-size:.78rem;color:var(--text-3);margin-bottom:8px}
  .post-card .excerpt{font-size:.9rem;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  article h1{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.03em;line-height:1.25;margin-bottom:10px}
  article .meta{font-size:.82rem;color:var(--text-3);margin-bottom:28px}
  article .content{white-space:pre-wrap;font-size:1.02rem;color:var(--text-2);line-height:1.85}
  .back{display:inline-block;margin-top:36px;font-size:.88rem;color:var(--text-3)}
  .back:hover{color:var(--accent)}
  .state{padding:48px 0;text-align:center;color:var(--text-3);font-size:.9rem}
  .state.error{color:#c0392b}
  footer{border-top:1px solid var(--border);margin-top:48px;padding:28px 0;font-size:.8rem;color:var(--text-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
  footer a:hover{color:var(--text)}
  @media (max-width:640px){
    footer{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <a href="./" class="brand">YAO<span>NET</span></a>
    <div class="header-links">
      <a href="https://yaonet.de5.net/">首页</a>
    </div>
  </div>
</header>

<main class="container" id="app">
  <div class="state">加载中…</div>
</main>

<footer class="container">
  <span>© 2025 YAONET · 博客</span>
  <span>
    <a href="https://yaonet.de5.net/">首页</a> ·
    <a href="https://t.me/yao_cn" target="_blank" rel="noopener">Telegram</a> ·
    <a href="mailto:yaoqingxuan20221@outlook.com">邮件</a>
  </span>
</footer>

<script>
const app = document.getElementById('app');
const postId = new URLSearchParams(location.search).get('id');

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(iso){
  try{ return new Date(iso).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}); }
  catch{ return ''; }
}

async function renderPost(id){
  try{
    const res = await fetch(`./content/${encodeURIComponent(id)}.json`, { cache:'no-cache' });
    if(!res.ok) throw new Error('not found');
    const post = await res.json();
    document.title = `${post.title || '文章'} · YAONET`;
    app.innerHTML = `
      <article>
        <h1>${esc(post.title || '无标题')}</h1>
        <div class="meta">${fmt(post.createdAt)}</div>
        <div class="content">${esc(post.content || '')}</div>
        <a class="back" href="./">← 返回文章列表</a>
      </article>`;
  }catch(e){
    app.innerHTML = `<div class="state error">文章不存在或暂时无法加载。<br><a href="./" style="color:var(--accent);margin-top:12px;display:inline-block;">返回列表</a></div>`;
  }
}

async function renderList(){
  try{
    const res = await fetch('./content/index.json', { cache:'no-cache' });
    if(!res.ok) throw new Error('index ' + res.status);
    const posts = await res.json();
    if(!Array.isArray(posts) || posts.length === 0){
      app.innerHTML = '<div class="state">还没有文章。</div>';
      return;
    }
    app.innerHTML = `
      <div class="list-head">
        <h2>全部文章</h2>
        <a href="https://yaonet.de5.net/">返回首页 →</a>
      </div>
      ${posts.map(p => `
        <a class="post-card" href="?id=${encodeURIComponent(p.id)}">
          <h3>${esc(p.title || '无标题')}</h3>
          <div class="meta">${fmt(p.createdAt)}</div>
          <div class="excerpt">${esc(p.excerpt || '')}</div>
        </a>
      `).join('')}`;
  }catch(e){
    app.innerHTML = '<div class="state error">加载失败，请检查网络后刷新。</div>';
  }
}

if(postId) renderPost(postId);
else renderList();
</script>
</body>
</html>
