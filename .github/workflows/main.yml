name: Build post index

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'content/**.json'
      - '!content/index.json'
      - 'scripts/build-index.js'
      - '.github/workflows/build-index.yml'

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate index
        run: node scripts/build-index.js
      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain content/index.json)" ]]; then
            echo "index.json unchanged, skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/index.json
          git commit -m "chore: rebuild post index [skip ci]"
          git push
      - name: Purge jsDelivr cache
        if: success()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/content/index.json" || true
